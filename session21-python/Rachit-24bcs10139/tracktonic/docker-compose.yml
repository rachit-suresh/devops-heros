services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracktonic
      POSTGRES_PASSWORD: tracktonic
      POSTGRES_DB: tracktonic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracktonic"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://tracktonic:tracktonic@db:5432/tracktonic
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
volumes:
  pgdata:
