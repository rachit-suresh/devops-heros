server {
  listen 8080;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
  location = /health { access_log off; return 200 "ok"; add_header Content-Type text/plain; }
  location /metrics { proxy_pass http://backend:8000/metrics; }
}
