apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      initContainers:
        - name: wait-migrations
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          command: ["python", "wait_db.py"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: tracktonic-db, key: url}}
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: tracktonic-db, key: url}}
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 5
---
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  labels: {app: tracktonic-migration}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: tracktonic-db, key: url}}
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  type: ClusterIP
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
