apiVersion: v1
kind: Secret
metadata: {name: tracktonic-db}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
  url: "postgresql://tracktonic:{{ .Values.postgres.password }}@db:5432/tracktonic"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: tracktonic}
            - {name: POSTGRES_DB, value: tracktonic}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: tracktonic-db, key: password}}
          ports: [{containerPort: 5432}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            exec: {command: [pg_isready, -U, tracktonic]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
---
apiVersion: v1
kind: Service
metadata: {name: db}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
